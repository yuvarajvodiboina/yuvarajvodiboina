<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Yuvaraj Vodiboina — from idea to shipped software</title>
  <desc id="desc">Independent Software Engineer. Web products, Chrome extensions and Android. Eleven products built, eight live products and four merged Wikimedia Commons Android pull requests.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10182c"/><stop offset="1" stop-color="#090d18"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5ee7f5"/><stop offset="1" stop-color="#b399ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="620" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="26" fill="url(#grid)"/>
  <ellipse cx="1250" cy="230" rx="480" ry="410" fill="url(#glow)"/>
  <rect x="1" y="1" width="1598" height="618" rx="25" fill="none" stroke="#334155"/>
  <rect x="62" y="62" width="5" height="27" rx="2" fill="#67e8f9"/>
  <g font-family="Arial, Helvetica, sans-serif">
