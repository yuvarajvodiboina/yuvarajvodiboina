<circle cx="84" cy="347" r="4" fill="#89f3cd"/>
<text x="106" y="354" font-size="19" fill="#a0f1d6">Open to engineering roles · Hyderabad / Remote</text>
</g>
<path d="M885 105H1515M885 310H1515" fill="none" stroke="#334765"/>
<path class="flow" d="M885 105H1515M1515 310H885" fill="none" stroke="url(#accent)" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<rect x="888" y="138" width="190" height="138" rx="15" fill="#13263a" stroke="#2a5f73"/>
