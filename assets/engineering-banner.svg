<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Yuvaraj Vodiboina — Independent Software Engineer</title>
<desc id="desc">Web, Chrome extensions and Android. Eleven products built, eight live, four merged Wikimedia Commons Android pull requests. Open to roles in Hyderabad or remote.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#090e1b"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#b8a0ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#7c69ee" stop-opacity=".25"/><stop offset="1" stop-color="#7c69ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a5b4fc" stroke-opacity=".05"/></pattern>
</defs>
<style>
.flow { stroke-dasharray: 7 17; animation: flow 5s linear infinite; }
.pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.glow { animation: glow 7s ease-in-out infinite; }
@keyframes flow { to { stroke-dashoffset: -240; } }
@keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.2); } }
@keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flow,.pulse,.glow { animation: none; } }
</style>
<rect width="1600" height="420" rx="24" fill="url(#bg)"/>
<rect width="1600" height="420" rx="24" fill="url(#grid)"/>
<ellipse class="glow" cx="1240" cy="210" rx="480" ry="360" fill="url(#glow)"/>
<rect x="1" y="1" width="1598" height="418" rx="23" fill="none" stroke="#334155"/>
<path d="M60 60H320" stroke="url(#accent)" stroke-width="3"/>
