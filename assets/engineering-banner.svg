<text x="60" y="108" font-size="19" letter-spacing="3" fill="#adbed9">INDEPENDENT SOFTWARE ENGINEER</text>
<text x="57" y="202" font-size="72" font-weight="700" letter-spacing="-3" fill="url(#accent)">Yuvaraj Vodiboina.</text>
<text x="60" y="251" font-size="25" fill="#d0dbee">Web products · Chrome extensions · Native Android</text>
<text x="60" y="293" font-size="21" fill="#92a7c6">Building and shipping at CodeHorizon</text>
